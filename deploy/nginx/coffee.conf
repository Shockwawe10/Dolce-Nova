# Coffee shop site. Drop into /etc/nginx/conf.d/ (included inside http {}), replace shop.example
# with your domain, then: sudo nginx -t && sudo systemctl reload nginx
# Static files from /srv/coffee/web; /api proxied to the Python app on 127.0.0.1:8000.

limit_req_zone $binary_remote_addr zone=checkout:10m rate=6r/m;   # 1 checkout per 10 s per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream coffee_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.example;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.example;

    ssl_certificate     /etc/letsencrypt/live/shop.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/coffee/web;
    index index.html;
    server_tokens off;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Pages: /success and /cancel are success.html and cancel.html. HTML always revalidates.
    # Cache headers use `expires`, not add_header: an add_header inside a location would drop
    # every server-level header above (nginx does not merge them).
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }

    # Versioned assets (fonts, images, css, js): cache for a year.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # Prices are read by the page; the server reads the same file at start-up.
    location = /data/catalog.json {
        expires -1;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://coffee_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/checkout {
        limit_req zone=checkout burst=3 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        client_max_body_size 8k;
        proxy_pass http://coffee_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Stripe webhook: the raw body must reach the app byte for byte (the signature covers it).
    # nginx does not alter request bodies; buffering it whole keeps Content-Length exact,
    # and no gzip/sub_filter/charset rewriting applies to request bodies. No rate limit here:
    # Stripe retries in bursts and a 429 would only delay fulfilment.
    location = /api/webhook {
        limit_except POST { deny all; }
        client_max_body_size 256k;
        proxy_request_buffering on;
        proxy_pass http://coffee_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
