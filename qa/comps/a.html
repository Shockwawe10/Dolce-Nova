<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comp A</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* A: flour-terracotta, Fraunces/Figtree, editorial split hero */
:root { --bg:#f6f1e7; --surface:#ebe3d4; --ink:#2b241e; --soft:#6b5f53; --line:#d6cbb8; --accent:#a3472b; --on-accent:#f6f1e7;
  --display:"Fraunces", Georgia, serif; --text:"Figtree", system-ui, sans-serif; --r:4px; }
.hero { display: grid; grid-template-columns: 5fr 6fr; }
.hero .copy { display: flex; flex-direction: column; justify-content: flex-end; gap: 32px; padding: 0 64px 96px max(16px, calc((100vw - 1280px) / 2)); }
.hero h1 { font-size: clamp(44px, 6vw, 88px); line-height: 1.02; letter-spacing: -0.028em; font-variation-settings: "opsz" 144; }
.hero .photo { position: relative; }
.hero .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; grid-template-rows: 46svh auto; }
  .hero .photo { order: -1; }
  .hero .copy { padding: 32px 16px 48px; }
  .top { color: var(--bg); }
}
</style></head>
<body>
<header class="top"><div class="wrap bar"><span class="mark">Dolce Nova</span>
  <nav class="nav"><span class="links"><a>Shop</a><a>Craft</a></span><span class="cart">Cart <b>0</b></span></nav></div></header>
<section class="hero">
  <div class="copy">
    <p class="label">Single-origin roastery</p>
    <h1>Every cup starts as a green bean.</h1>
    <p class="lede">Six single-origin coffees, roasted in small batches. 250 g from €11.50.</p>
    <p><a class="btn">Shop the coffees</a></p>
  </div>
  <div class="photo"><picture><source type="image/avif" srcset="../../site/assets/img/hero-1920.avif"><img src="../../site/assets/img/hero-1920.webp" width="1920" height="1277" alt=""></picture></div>
</section>
<section class="shop"><div class="wrap"><h2>Six coffees, three grinds.</h2><div class="grid" id="shop-grid"></div></div></section>
<script src="shop.js"></script>
</body></html>
